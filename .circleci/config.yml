# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

parameters:
  run_employees:
    type: boolean
    default: false
  run_login:
    type: boolean
    default: false
  run_recruitment:
    type: boolean
    default: false

jobs:
  run-tests:
    parameters:
      module:
        type: string
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Run tests for module
          command: mvn -Dtest=**/<< parameters.module >>/** test

workflows:
  employees_tests:
    when: << pipeline.parameters.run_employees >>
    jobs:
      - run-tests:
          module: "employees"

  login_tests:
    when: << pipeline.parameters.run_login >>
    jobs:
      - run-tests:
          module: "login"

  recruitment_tests:
    when: << pipeline.parameters.run_recruitment >>
    jobs:
      - run-tests:
          module: "recruitment"